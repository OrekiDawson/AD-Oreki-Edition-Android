title: 性能、调度器与时序合理性
rule: 以Critical严重程度审查性能与时序风险。检查反射调用、状态刷新和自动化调度中可能出现的递归环、StackOverflowError、主线程阻塞、重复遍历、长时间卡顿、UI假死、内存或资源异常增长和明显性能退化。检查阶段顺序、前置条件、事件因果和自动化时序：首次大坍缩后不得提前出现永恒层，阶段重置后不得残留旧调度，同帧结算顺序、离线结算和刷新顺序必须合理。主动操作和自动购买后应保证资源、按钮、页签与阶段显示实时更新。不得以隐藏整个导航容器解决单个入口的门禁问题。仅报告与本次变更直接相关且有实际影响的性能或时序问题，避免无证据的优化建议。
severity: critical
scope: pull-request
