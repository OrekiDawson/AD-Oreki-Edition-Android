title: Android 3.21兼容与绑定安全
rule: >-
  当变更涉及Android
  Kotlin补丁、反射、类名、方法、字段或启动入口时，检查其是否与官方3.21基线一致。不得将旧版混淆类映射直接当作新版真实ABI，不得通过activity-alias或修改版本标识伪装官方基线。没有实际构建或运行证据时不得声称兼容已验证。
severity: critical
scope: file
path: '**/*.{kt,java,smali,gradle,xml}'
examples: []
inheritance:
  inheritable: true
  exclude: []
  include: []
