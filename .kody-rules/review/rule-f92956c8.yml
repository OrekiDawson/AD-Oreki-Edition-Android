title: 最小必要验证与可追溯交付
rule: 对游戏机制、存档、构建和发布相关修改，检查PR是否明确说明受影响行为、关键验证证据、已知风险及未完成事项。Android发布必须来自真实Release构建；不得将仅构建成功表述为运行验收通过。遵循最小必要验证原则，不要求每次变更做全部180分钟长跑或全量回归。涉及生产倍率、自动化、阶段解锁、挑战、时间系统或存档时，必须验证真实墙钟进度、阶段耗时与资源/时间曲线，区分时序错误、过快、过慢、停滞和时间计算错误。不得伪造四渠道发布状态或校验值。
severity: critical
scope: pull-request
examples: []
inheritance:
  inheritable: true
  exclude: []
  include: []
