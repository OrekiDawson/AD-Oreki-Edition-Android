name: Android 源码持续集成

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: 源码规范与回归检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # 快速识别 AGP Candidate 契约漂移：纯 Python，不等待 JDK、Gradle 与其他长串测试。
      - name: Fast-fail AGP candidate wiring contract
        run: python3 -m unittest scripts.tests.test_agp_candidate_wiring -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enforce active repository rule entrypoints
        run: |
          test -s AGENTS.md
          test -s docs/DELIVERY_RULES.md
          test -s .github/pull_request_template.md
          grep -Fq 'DELIVERY_RULES.md' AGENTS.md
      # R114-01 facts-split：事实库永久防膨胀守卫（根 <=400 行、主题 <=1200 行、链接/锚点、ID 唯一、无滚动文件、LF）。
      - name: Enforce facts library governance (root <=400 lines, topics <=1200, links, IDs, LF)
        run: python3 scripts/check_facts_governance.py
      - name: Test facts library governance guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_facts_governance.py' -v
      - name: Validate Python build helper syntax
        run: python3 -m compileall -q scripts
      - name: Enforce retired Python/Smali production chain
        run: python3 scripts/check_buildmod_retired.py
      # R114-02 C4（Issue #52）：原本在 build_mod 生产构建期执行的 Kotlin 契约校验
      # （GameApi 别名 / Break 商店 / AU4b）迁为独立 CI 任务，失败即阻断合并。
      - name: Verify Kotlin build contracts
        run: |
          python3 scripts/verify_build_contracts.py
          python3 scripts/verify_build_contracts.py --selftest
      - name: Test build-contract verifier migration guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_verify_build_contracts.py' -v
      # R122（Issue #52/#61）：AGP 完整游戏必须从官方 3.21 base + mdpi split 生成输入，
      # 不得重新依赖 work/mod、modtree 或旧的 Python 阶段目录生产者。
      - name: Test AGP native full-game input guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_agp_native_fullgame_inputs.py' -v
      - name: Test Android 64-bit ABI policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_android_abi_policy.py' -v
      - name: Test source-takeover manifest and AGP compiled-product guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_agp_source_takeover.py' -v
      - name: Test source-takeover ABI and final-DEX guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_source_takeover_abi.py' -v
      - name: Validate scoped Codex DeepSeek PR review policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_no_deepseek_ci.py' -v
      - name: Validate cross-repo review, shared quota and Publisher
        run: |
          node --test .github/kody/trigger.test.mjs
          node scripts/tests/test_review_context.mjs
          node scripts/tests/test_audit_quota.mjs
          node scripts/tests/test_publish_review.mjs
      - name: Verify DeepSeek off-peak billing calendar and time boundaries
        run: python3 -m unittest discover -s scripts/tests -p 'test_deepseek_pricing.py' -v
      # Existing source baseline has 67 naming violations (first CI run).
      # Do not misreport them as PASS; audit warns while tracked-source CI remains usable.
      - name: Kotlin naming audit (existing debt, advisory)
        continue-on-error: true
        run: python3 scripts/check_kotlin_naming.py
      - name: Test incremental Kotlin naming debt guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_kotlin_naming_delta.py' -v
      - name: Block only NEW Kotlin naming violations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "::notice::No Git comparison base on manual runs; full Kotlin audit remains advisory"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]] || {
            echo "::error::Missing trustworthy Git comparison base for naming-debt guard"
            exit 1
          }
          # [R116-02-01] base SHA 可能因 main 重写而不可达：回退到 main 的浅克隆，
          # 保证命名增量检查在合法比较基上运行，而不是直接判失败。
          git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_SHA" || \
            git fetch --no-tags --filter=blob:none --depth=1 origin main
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse FETCH_HEAD)
            echo "::warning::base $BASE_SHA unreachable; falling back to origin/main=$BASE_SHA"
          fi
          # [R116-03-01 Kody] 回退后 BASE_SHA 可能等于 HEAD：此时增量检查会空跑（无 diff ⇒ 恒无违规），
          # 等于把 fail-closed 的守卫静默变成 always-pass。这里显式拦截，保持 fail-closed。
          if [ "$BASE_SHA" = "$(git rev-parse HEAD)" ]; then
            echo "::error::comparison base equals HEAD; naming-debt guard would run vacuously"
            exit 1
          fi
          python3 scripts/check_kotlin_naming_delta.py --base "$BASE_SHA"
      - name: Test new source policy guards
        run: python3 -m unittest discover -s scripts/tests -p 'test_repository_policy.py' -v
      - name: Test Ready and Kody concurrency wording contract (documentation only)
        run: python3 -m unittest discover -s scripts/tests -p 'test_review_ready_policy.py' -v
      - name: Test achievement audit cycle parsing
        run: python3 -m unittest discover -s scripts/tests -p 'test_ach_audit.py' -v
      - name: Reject newly introduced credential files, CRLF, and Java/Smali payloads
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "::notice::NOT RUN: manual dispatch has no trusted comparison base"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]] || {
            echo "::error::Missing trustworthy base SHA for repository policy"
            exit 1
          }
          git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_SHA" || \
            git fetch --no-tags --filter=blob:none --depth=1 origin main
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse FETCH_HEAD)
            echo "::warning::base $BASE_SHA unreachable; falling back to origin/main=$BASE_SHA"
          fi
          # [R116-03-01 Kody] 同 naming 守卫：base 等于 HEAD 时策略检查会空跑，显式 fail-closed。
          if [ "$BASE_SHA" = "$(git rev-parse HEAD)" ]; then
            echo "::error::comparison base equals HEAD; repository policy guard would run vacuously"
            exit 1
          fi
          python3 scripts/check_repository_policy.py --base "$BASE_SHA" --policy android
      - name: Test staged AGP directory migration policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_directory_layout.py' -v
      - name: Enforce staged AGP production Kotlin source directories
        run: python3 scripts/check_directory_layout.py
      # Issue #25：DEX→JVM 转换器的类排除、keep-kotlin、dash 修复与覆盖核对
      # 使用合成夹具即可 fail-closed，不依赖官方 APK 或私有基线。
      - name: Test AGP game JAR input conversion contract
        run: python3 -m unittest scripts.tests.test_agp_gamejar -v
      - name: Test four-channel delivery preflight and stable-release promotion
        run: python3 -m unittest discover -s scripts/tests -p 'test_delivery_preflight.py' -v
      - name: Test immutable archive-only recovery without changing stable Latest
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_archive.py' -v
      - name: Check frozen baseline and MOD release version contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_version_contract.py' -v
      - name: Validate baseline configuration format
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('baseline/version-config.json')
          cfg = json.loads(path.read_text(encoding='utf-8'))
          assert isinstance(cfg.get('versions'), dict) and cfg.get('current') in cfg['versions']
          print('PASS: baseline config current version is defined')
          PY
      - name: Gradle configuration smoke (NOT an APK build)
        run: bash ./gradlew help --no-daemon --console=plain
      - name: Cache pinned actionlint module and Go build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: android-actionlint-${{ runner.os }}-${{ runner.arch }}-v1.7.12
      # actionlint 必须覆盖仓库内全部工作流。固定版本尚不识别 GitHub 的
      # concurrency.queue，仅忽略该已知语法差异，不忽略其他错误。
      - name: Lint every repository workflow with pinned actionlint
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            -ignore 'unexpected key "queue"' \
            .github/workflows/ci.yml \
            .github/workflows/candidate-unified.yml \
            .github/workflows/codex-deepseek-review.yml \
            .github/workflows/r8-experiment.yml \
            .github/workflows/pr-review-summary.yml \
            .github/workflows/kody-trigger.yml \
            .github/workflows/verify-unified.yml \
            .github/workflows/release-gate-unified.yml \
            .github/workflows/release-unified.yml \
            .github/workflows/release-validate-unified.yml
      - name: Enforce single-repo migration safety invariants
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_migration.py' -v
      - name: Test fail-closed AGP-only production policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_agp_only_policy.py' -v
      - name: Test AGP candidate provenance producer
        run: python3 -m unittest scripts.tests.test_agp_provenance -v
      - name: Test patch-contract alignment (4 处过时契约)
        run: python3 -m unittest scripts.tests.test_patch_contract_align -v
      - name: Run migrated immutable release gate regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_unified_release_*.py' -v
      - name: Test dev-machine stable pull and atomic local channel
        run: python3 -m unittest discover -s scripts/tests -p 'test_local_pull.py' -v
      - name: Test acceptance.json builder (fail-closed, no fabricated evidence)
        run: python3 -m unittest discover -s scripts/tests -p 'test_build_acceptance_json.py' -v
      - name: Test AGP phase-1 parity helpers
        run: python3 -m unittest discover -s scripts/tests -p 'test_agp_parity.py' -v
      - name: Test AGP phase-3 full-game input preparation
        run: python3 -m unittest discover -s scripts/tests -p 'test_agp_fullgame_prepare.py' -v
      # R113-01：R109 诊断工具（缺失引用扫描 / Gson 存档闭包）的 fail-closed 回归。
      # 两者此前会把"解析失败/构建输入缺失"当成成功，属于 Codex 审查 P2 已确认缺陷。
      - name: Test R109 diagnostic tooling fail-closed guards
        run: python3 -m unittest discover -s scripts/tests -p 'test_r109_tooling.py' -v
      - name: Explain source-only evidence
        run: |
          echo "::notice::This job checks tracked sources and Gradle configuration only."
          echo "::notice::Real APK build, signature, DEX contract and AVD tests require the protected local baseline and dedicated runner."

  source-checks:
    # Preserve the required check name; proprietary AGP builds are a separate,
    # explicitly NOT RUN check when their frozen inputs are unavailable.
    name: Source checks (no proprietary APK baseline)
    needs: source-policy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful source-policy validation
        env:
          POLICY_RESULT: ${{ needs.source-policy.result }}
        run: |
          set -euo pipefail
          if [[ "$POLICY_RESULT" != success ]]; then
            echo "::error::Required source-policy CI failed: policy=$POLICY_RESULT"
            exit 1
          fi
          echo "PASS: public source policy completed successfully"
          echo "NOT RUN: proprietary AGP full-game APK, ABI and DEX parity are not claimed by this check."

  agp-kotlin-dex:
    name: AGP 专有输入构建（缺输入时明确 NOT RUN）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install API 37 and pinned Build Tools
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: 检测专有完整游戏输入
        id: full_game_inputs
        run: |
          set -euo pipefail
          if [[ -f build/inputs/game-final.jar &&
                -d build/inputs/base_decoded_321 &&
                -d build/inputs/mdpi_decoded_321 ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'PASS: pinned full-game inputs are present'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            {
              echo '## AGP 专有输入构建：NOT RUN'
              echo
              echo '公共 runner 缺少冻结的 `game-final.jar`、官方解码树和 mdpi split。'
              echo '本检查只执行为公开源码可用的自测，不把跳过的完整游戏构建记为 PASS。'
            } >> "$GITHUB_STEP_SUMMARY"
            echo '::warning::专有完整游戏输入缺失；APK、ABI 与 DEX parity 为 NOT RUN'
          fi
      - name: Verify store-policy JAR gate self-test
        run: bash ./gradlew :app:verifyStorePolicyOutputSelfTest --no-daemon --max-workers=1 --console=plain
      - name: Test constructor ASM invariants
        run: bash ./gradlew -p build-logic test --no-daemon --max-workers=1 --console=plain
      - name: Build AGP 9 Kotlin DEX
        if: steps.full_game_inputs.outputs.available == 'true'
        # R111 CI-6：构建日志落盘，失败时随证据一起上传，避免只能翻折叠的 Actions 日志。
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          bash ./gradlew :app:assembleDebug :app:copyAgpKotlinClasses --no-daemon --console=plain 2>&1 | tee ci-evidence/agp-kotlin-dex-build.log
      - name: Enforce ABI guard on AGP-compiled classes
        if: steps.full_game_inputs.outputs.available == 'true'
        run: python3 scripts/build_kotlin.py --verify-abi --classes app/build/agp-kotlin-classes
      - name: Enforce AGP DEX parity with the legacy chain
        if: steps.full_game_inputs.outputs.available == 'true'
        run: python3 scripts/verify_agp_parity.py --expected-classes scripts/kotlin_business_classes.txt --agp-apk app/build/outputs/apk/debug/app-debug.apk --result-file agp-parity.json
      - name: Record full-game build as NOT RUN without proprietary inputs
        if: steps.full_game_inputs.outputs.available != 'true'
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          printf '%s\n' \
            'NOT RUN: full-game APK build, ABI guard and DEX parity require the pinned proprietary inputs.' \
            'Public source-policy checks and build-logic self-tests did run.' \
            'This public source check does not infer PASS from a skipped APK build.' \
            | tee ci-evidence/full-game-build-not-run.txt
          echo '::error::AGP专有输入构建为 NOT RUN；该 check 不得显示为成功'
          exit 1
      - name: Upload AGP phase-1 evidence
        # R111 CI-6：无论成败都上传已产生的构建日志与 parity 结果；失败时至少保留可诊断线索，
        # 成功后仍要求 parity 证据存在（下一步单独校验，避免用 if-no-files-found: warn 掩盖缺失）。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agp-phase1-evidence
          path: |
            agp-parity.json
            ci-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Require AGP parity evidence
        if: steps.full_game_inputs.outputs.available == 'true'
        run: test -s agp-parity.json || { echo '::error::缺少 agp-parity.json（AGP DEX parity 未产出）'; exit 1; }
