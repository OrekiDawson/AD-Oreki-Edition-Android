name: Android Source CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks (no proprietary APK baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Python build helper syntax
        run: python3 -m compileall -q scripts
      - name: Kotlin naming contract
        run: python3 scripts/check_kotlin_naming.py
      - name: Validate baseline configuration format
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('baseline/version-config.json')
          cfg = json.loads(path.read_text(encoding='utf-8'))
          assert isinstance(cfg.get('versions'), dict) and cfg.get('current') in cfg['versions']
          print('PASS: baseline config current version is defined')
          PY
      - name: Gradle configuration smoke (NOT an APK build)
        run: ./gradlew help --no-daemon --console=plain
      - name: Explain source-only evidence
        run: |
          echo "::notice::This job checks tracked sources and Gradle configuration only."
          echo "::notice::Real APK build, signature, DEX contract and AVD tests require the protected local baseline and dedicated runner."
