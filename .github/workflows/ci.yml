name: Android Source CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    # Required on main. Run even if AGP failed so a skipped check cannot pass branch protection.
    needs: agp-kotlin-dex
    if: always()
    name: Source checks (no proprietary APK baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful AGP 9.5.1 compilation before any Source PASS
        env:
          AGP_RESULT: ${{ needs.agp-kotlin-dex.result }}
        run: |
          if [[ "$AGP_RESULT" != success ]]; then
            echo "::error::AGP job did not pass: $AGP_RESULT"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enforce active repository rule entrypoints
        run: |
          test -s AGENTS.md
          test -s docs/DELIVERY_RULES.md
          test -s .github/pull_request_template.md
          grep -Fq 'DELIVERY_RULES.md' AGENTS.md
      - name: Validate Python build helper syntax
        run: python3 -m compileall -q scripts
      - name: Ensure DeepSeek AI review and failure triage remain disabled
        run: python3 -m unittest discover -s scripts/tests -p 'test_no_deepseek_ci.py' -v
      - name: Verify DeepSeek off-peak billing calendar and time boundaries
        run: python3 -m unittest discover -s scripts/tests -p 'test_deepseek_pricing.py' -v
      # Existing source baseline has 67 naming violations (first CI run).
      # Do not misreport them as PASS; audit warns while tracked-source CI remains usable.
      - name: Kotlin naming audit (existing debt, advisory)
        continue-on-error: true
        run: python3 scripts/check_kotlin_naming.py
      - name: Test incremental Kotlin naming debt guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_kotlin_naming_delta.py' -v
      - name: Block only NEW Kotlin naming violations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "::notice::No Git comparison base on manual runs; full Kotlin audit remains advisory"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]] || {
            echo "::error::Missing trustworthy Git comparison base for naming-debt guard"
            exit 1
          }
          git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_SHA"
          python3 scripts/check_kotlin_naming_delta.py --base "$BASE_SHA"
      - name: Test new source policy guards
        run: python3 -m unittest discover -s scripts/tests -p 'test_repository_policy.py' -v
      - name: Reject newly introduced credential files, CRLF, and Java/Smali payloads
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "::notice::NOT RUN: manual dispatch has no trusted comparison base"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]] || {
            echo "::error::Missing trustworthy base SHA for repository policy"
            exit 1
          }
          git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_SHA"
          python3 scripts/check_repository_policy.py --base "$BASE_SHA" --policy android
      - name: Test four-channel delivery preflight and stable-release promotion
        run: python3 -m unittest discover -s scripts/tests -p 'test_delivery_preflight.py' -v
      - name: Test immutable archive-only recovery without changing stable Latest
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_archive.py' -v
      - name: Validate baseline configuration format
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('baseline/version-config.json')
          cfg = json.loads(path.read_text(encoding='utf-8'))
          assert isinstance(cfg.get('versions'), dict) and cfg.get('current') in cfg['versions']
          print('PASS: baseline config current version is defined')
          PY
      - name: Gradle configuration smoke (NOT an APK build)
        run: bash ./gradlew help --no-daemon --console=plain
      - name: Validate unified hosted build and independent verification workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/candidate-unified.yml \
            .github/workflows/verify-unified.yml \
            .github/workflows/release-gate-unified.yml \
            .github/workflows/release-unified.yml \
            .github/workflows/release-validate-unified.yml
      - name: Enforce single-repo migration safety invariants
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_migration.py' -v
      - name: Test fail-closed AGP-only production policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_agp_only_policy.py' -v
      - name: Run migrated immutable release gate regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_unified_release_*.py' -v
      - name: Test dev-machine stable pull and atomic local channel
        run: python3 -m unittest discover -s scripts/tests -p 'test_local_pull.py' -v
      - name: Test AGP phase-1 parity helpers
        run: python3 -m unittest discover -s scripts/tests -p 'test_agp_parity.py' -v
      - name: Test AGP phase-3 full-game input preparation
        run: python3 -m unittest discover -s scripts/tests -p 'test_agp_fullgame_prepare.py' -v
      - name: Explain source-only evidence
        run: |
          echo "::notice::This job checks tracked sources and Gradle configuration only."
          echo "::notice::Real APK build, signature, DEX contract and AVD tests require the protected local baseline and dedicated runner."

  agp-kotlin-dex:
    name: AGP 9.5.1 Kotlin DEX parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Build AGP 9 Kotlin DEX
        run: bash ./gradlew -p agp :app:assembleDebug :app:copyAgpKotlinClasses --no-daemon --console=plain
      - name: Enforce ABI guard on AGP-compiled classes
        run: python3 scripts/build_kotlin.py --verify-abi --classes agp/app/build/agp-kotlin-classes
      - name: Enforce AGP DEX parity with the legacy chain
        run: python3 scripts/verify_agp_parity.py --expected-classes scripts/kotlin_business_classes.txt --agp-apk agp/app/build/outputs/apk/debug/app-debug.apk --result-file agp-parity.json
      - name: Upload AGP phase-1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: agp-phase1-evidence
          path: agp-parity.json
          if-no-files-found: error
