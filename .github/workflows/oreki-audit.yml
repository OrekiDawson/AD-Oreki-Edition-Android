# Oreki Audit Bot —— 独立 GitHub App 审查执行器（受信任默认分支工作流）
#
# 设计边界（不可放宽）：
# - 只在受信任的默认分支执行；**绝不 checkout PR head**，不运行 PR 里的任何代码/脚本/构建。
# - Diff 一律经 GitHub API 读取，Serge 以只读方式审查。
# - 评论与 Check Run 使用 GitHub App installation token → 作者是 App Bot，不是 github-actions[bot]。
# - 调用模型前必须先过 scripts/audit/preflight.py（高峰/余额/规模/信任/幂等）。
# - 任何未执行/失败路径都发布 failure（或干脆不发布），绝不用 success/neutral/skipped 冒充。
#
# 启用前置（见 docs/audit-bot.md）：App 已注册并安装、仓库变量 OREKI_AUDIT_ENABLED=true、
# Secrets: OREKI_AUDIT_APP_ID / OREKI_AUDIT_APP_PRIVATE_KEY / OREKI_AUDIT_LLM_KEY。
name: Oreki Audit

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: oreki-audit-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    if: |
      vars.OREKI_AUDIT_ENABLED == 'true' &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '@oreki-audit')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout default branch (never PR head)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            PR="${{ github.event.pull_request.number }}"
          else
            PR="${{ github.event.issue.number }}"
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > pr.json
          SHA="$(jq -r .head.sha pr.json)"
          HEAD_REPO="$(jq -r .head.repo.full_name pr.json)"
          BASE_REF="$(jq -r .base.ref pr.json)"
          AUTHOR="$(jq -r .user.login pr.json)"
          STATE="$(jq -r .state pr.json)"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" > files.json
          DIFF_CHARS="$(jq '[.[] | (.patch // "")] | join("") | length' files.json)"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "head_repo=$HEAD_REPO" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "diff_chars=$DIFF_CHARS" >> "$GITHUB_OUTPUT"

      - name: Preflight guards (peak / balance / size / trust)
        id: preflight
        env:
          OREKI_AUDIT_LLM_KEY: ${{ secrets.OREKI_AUDIT_LLM_KEY }}
        run: |
          set +e
          python3 scripts/audit/preflight.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ steps.meta.outputs.pr }}" \
            --sha "${{ steps.meta.outputs.sha }}" \
            --trigger "${{ github.event_name }}" \
            --head-repo "${{ steps.meta.outputs.head_repo }}" \
            --base-repo "$GITHUB_REPOSITORY" \
            --base-ref "${{ steps.meta.outputs.base_ref }}" \
            --default-branch main \
            --author-is-bot "${{ github.event.comment.user.type == 'Bot' }}" \
            --pr-open "${{ steps.meta.outputs.state == 'open' }}" \
            --diff-chars "${{ steps.meta.outputs.diff_chars }}" \
            --check-balance --out preflight.json
          RC=$?
          echo "allow=$(jq -r .allow preflight.json)" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r '.reasons|join(",")' preflight.json)" >> "$GITHUB_OUTPUT"
          echo "external_id=$(jq -r .idempotency_key preflight.json)" >> "$GITHUB_OUTPUT"
          echo "preflight_rc=$RC"
          exit 0

      - name: Mint GitHub App installation token
        if: steps.preflight.outputs.allow == 'true'
        id: bot
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.OREKI_AUDIT_APP_ID }}
          private-key: ${{ secrets.OREKI_AUDIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Serge review (pinned, comment-only)
        if: steps.preflight.outputs.allow == 'true'
        id: serge
        uses: huggingface/serge@6668325d7a4a2e9c3fe814f95f249df0ec347cfd
        with:
          github_token: ${{ steps.bot.outputs.token }}
          llm_api_key: ${{ secrets.OREKI_AUDIT_LLM_KEY }}
          llm_api_base: https://api.deepseek.com/v1
          llm_model: deepseek-chat
          llm_max_tokens: "8192"
          llm_stream: "true"
          max_diff_chars: "180000"
          tool_max_iterations: "4"
          review_event: COMMENT
          review_rules_path: .ai/review-rules.md
        continue-on-error: true

      - name: Publish Oreki Audit / review check
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set +e
          POSTED=false
          if [ "${{ steps.serge.outcome }}" = "success" ]; then POSTED=true; fi
          EXEC=true
          if [ "${{ steps.preflight.outputs.allow }}" != "true" ]; then EXEC=false; fi
          python3 scripts/audit/checks_adapter.py --mode publish \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ steps.meta.outputs.pr }}" \
            --head-sha "${{ steps.meta.outputs.sha }}" \
            --external-id "${{ steps.preflight.outputs.external_id }}" \
            --review-posted "$POSTED" --executed "$EXEC" \
            --review-file serge-review.md || true
