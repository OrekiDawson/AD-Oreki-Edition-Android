name: DeepSeek CI failure triage (advisory)

'on':
  workflow_run:
    workflows: ["Android Source CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed workflow run ID to diagnose
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deepseek-triage-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Analyze failed job metadata without exposing logs or secrets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: python3 scripts/deepseek_ci_triage.py
      - name: Clarify non-blocking busy-hour behavior
        run: |
          echo "::notice::Peak-hour API throttling skips only AI commentary; original CI checks and release gates remain unchanged."
