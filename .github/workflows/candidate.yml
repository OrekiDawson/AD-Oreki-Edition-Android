name: Request Android Candidate Build (private builder)

'on':
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact main commit SHA approved for private APK build'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oreki-android-candidate-request
  cancel-in-progress: false

jobs:
  request-private-build:
    # Never attach a persistent secret-bearing runner to this public repository.
    # See GitHub's self-hosted-runner security guidance for public repositories.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-candidate
    timeout-minutes: 10
    steps:
      - name: Validate source revision and protected builder configuration
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          PRIVATE_REPO: ${{ vars.ANDROID_PRIVATE_BUILDER_REPO }}
        run: |
          set -euo pipefail
          if [[ ! "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$APPROVED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::approved_sha must match the selected main commit"
            exit 1
          fi
          if [[ ! "$PRIVATE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Configure ANDROID_PRIVATE_BUILDER_REPO (owner/private-repository) in the android-candidate environment"
            exit 1
          fi
      - name: Request isolated build via private repository_dispatch
        env:
          PRIVATE_REPO: ${{ vars.ANDROID_PRIVATE_BUILDER_REPO }}
          PRIVATE_BUILDER_TOKEN: ${{ secrets.ANDROID_PRIVATE_BUILDER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_BUILDER_TOKEN" ]]; then
            echo "::error::Configure ANDROID_PRIVATE_BUILDER_TOKEN in the android-candidate environment"
            exit 1
          fi
          payload="$(jq -nc --arg sha "$GITHUB_SHA" '{event_type:"ad-android-candidate",client_payload:{source_repository:"OrekiDawson/AD-Oreki-Edition-Android",source_sha:$sha}}')"
          curl --fail-with-body --silent --show-error --retry 2 \
            -X POST "https://api.github.com/repos/$PRIVATE_REPO/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PRIVATE_BUILDER_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload"
          echo "::notice::Request sent to private builder. This job does NOT build, verify, sign, publish, or attest an APK."
