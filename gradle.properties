# 反物质维度 Oreki Edition —— Gradle 运行参数
#
# 根级 AGP 工程统一使用 Kotlin DSL。完整游戏输入、资源 ID 校验与 R8
# 需要高于默认值的堆；配置缓存暂不启用，等待所有 included-build 任务完成 Provider 化。
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.warning.mode=all
org.gradle.vfs.watch=false

# R129 Windows 原生：项目位于中文路径（安卓端），AGP 默认路径检查会直接阻断构建。
# 仅在 Windows 原生构建启用该兼容开关；Linux/CI 仍走默认检查。
android.overridePathCheck=true
