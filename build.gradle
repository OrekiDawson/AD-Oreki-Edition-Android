tasks.register('verifyBaseline') {
    group = 'oreki-baseline'
    description = '用 Rust 校验指定 APK 与当前基线清单的一致性（需 -PorekiBaselineApk=...）'
    dependsOn 'buildBaselineTool'
    doLast {
        def rawApk = project.findProperty('orekiBaselineApk')
        if (!rawApk) {
            throw new GradleException('verifyBaseline 需要 -PorekiBaselineApk=/path/to/original.apk；不猜测 APK 路径')
        }
        def apk = file(rawApk)
        if (!apk.isFile()) throw new GradleException("基线 APK 不存在：${apk}")
        execOps.exec {
            workingDir = baselineToolDir
            commandLine baselineToolExe.absolutePath, 'verify', '--root', '..',
                '--version', currentBaselineVersion.toString(), '--apk', apk.absolutePath
        }
    }
}

// ====================================================================== clean
// 覆盖 Gradle 默认 clean：只清 Gradle 自己的暂存目录。
// build/ 下还有 onedrive_archive/、xiaomi_archive/、backup_*.apk 等唯一备份，
// release/ 下是正式发布物 —— 一律不得被 clean 触碰。
tasks.register('clean') {
    group = 'oreki'
    description = '只清理 build/gradle-stage 与 build/gradle-reports（不动 release/ 与 build/ 归档备份）'
    doLast {
        [stageDir, new File(buildRoot, 'gradle-verify-apk')].each { d ->
            if (d.exists()) { d.deleteDir(); step("已删除 ${d}") }
        }
        step('release/、build/*archive*、build/backup* 未被触碰')
    }
}

// [R93/RG02-13] 构建预算与重复构建拦截（每轮默认 1 次最终 Release 构建）
apply from: new File(rootDir, 'gradle/release-budget.gradle')
