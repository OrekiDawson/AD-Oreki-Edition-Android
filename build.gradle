// =============================================================== installToRelease
// 显式任务：把已通过 verifyRelease + verifyPatchContract 的候选替换为正式发布文件。
// 默认不参与 build。R91 起同时写出 build/release-manifest.json，作为发布身份唯一凭据。
tasks.register('installToRelease') {
    group = 'oreki'
    description = '校验候选与报告一致，复制到 release/ 并写发布身份清单（覆盖前留档）'
    dependsOn 'verifyRelease', 'verifyPatchContract'
    doLast {
        if (!stageApk.exists()) throw new GradleException("候选 APK 不存在：${stageApk}")
        if (!verifyReport.isFile()) throw new GradleException("缺少 verifyRelease 报告：${verifyReport}")
        def report = new JsonSlurper().parse(verifyReport)
        if (report.failed != 0) throw new GradleException("verifyRelease 未全通过：failed=${report.failed}")
        def stageHash = hashOf(stageApk)
        def stageSize = stageApk.length()
        if (report.apk != stageApk.absolutePath) {
            throw new GradleException("验证报告与候选路径不一致：report=${report.apk} stage=${stageApk.absolutePath}")
        }
        if (report.sha256 != stageHash) {
            throw new GradleException("验证报告与候选哈希不一致：report=${report.sha256} stage=${stageHash}")
        }
        if (report.package != pkgName) {
            throw new GradleException("候选包名不是项目包：${report.package}")
        }
        if (!report.versionName || !report.versionCode || !report.cert_sha256) {
            throw new GradleException("verifyRelease 报告缺少版本/证书字段，拒绝写入发布清单")
        }
        step("候选 SHA-256: ${stageHash} (${stageSize} B)")

        releaseApk.parentFile.mkdirs()
        if (releaseApk.exists()) {
            def oldHash = hashOf(releaseApk)
            step("现有发布 SHA-256: ${oldHash}")
            if (oldHash == stageHash) {
                step('候选与现有发布完全一致，不再复制；仍刷新发布清单')
            } else {
                deliveryArchive.mkdirs()
                def stamp = new Date().format('yyyyMMdd-HHmmss')
                def archive = new File(deliveryArchive, "release_${oldHash.substring(0, 8)}_${stamp}.apk")
                java.nio.file.Files.copy(releaseApk.toPath(), archive.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                step("旧发布已留档: ${archive}")
                java.nio.file.Files.copy(stageApk.toPath(), releaseApk.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } else {
            java.nio.file.Files.copy(stageApk.toPath(), releaseApk.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        def newHash = hashOf(releaseApk)
        if (newHash != stageHash) throw new GradleException("复制后哈希不一致: ${newHash} != ${stageHash}")

        // 清单只记录本次真实构建 + 本次验证报告，不硬编码任何历史 SHA。
        def manifest = [
            schema: 1,
            created_at: new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
            baseline_version: currentBaselineVersion,
            build: [
                source_apk: stageApk.absolutePath,
                source_sha256: stageHash,
                source_size: stageSize,
                package: report.package,
                versionName: report.versionName,
                versionCode: report.versionCode,
                cert_sha256: report.cert_sha256,
                schemes: report.schemes,
                verify_report: verifyReport.absolutePath,
                verify_failed: report.failed,
            ],
            release: [
                apk: releaseApk.absolutePath,
                sha256: newHash,
                size: releaseApk.length(),
            ],
        ]
        releaseManifest.parentFile.mkdirs()
        // [R96] Groovy 5 的 File.writeText 不再接受 (String, String)：用 setText(text, charset)。
        releaseManifest.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)), 'UTF-8')
        step("发布清单已写: ${releaseManifest}（${report.versionName}/${report.versionCode}）")
        step("已替换 release/反物质维度.apk -> ${newHash}")
    }
}

