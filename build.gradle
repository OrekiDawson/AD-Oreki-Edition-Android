/*
 * 反物质维度 Oreki Edition —— Android 构建入口（方案 B：Gradle 调度现有 smali 流水线）
 * ------------------------------------------------------------------------------------
 * 为什么不是标准 AGP 工程：
 *   上游 APK 是原生 Kotlin 混淆产物，仓库没有任何可编译的 Java/Kotlin 源码；
 *   正式产物由 scripts/build_mod.py 完成「apktool 反编译树 -> smali 补丁 -> 重建」；
 *   Gradle 直接调用 zipalign/apksigner 完成产物收尾。用 AGP 重建目录结构等于重写已稳定的构建链，
 *   还会丢失 smali 补丁与资源 ID 修补。因此这里让 Gradle 只做编排：任务体一律是
 *   Exec 调用真实脚本，退出码原样上抛，不做 Shell 字符串拼接。
 *
 * 安全约定（与 R4 执行令一致）：
 *   1. assembleRelease 把候选 APK 输出到 build/gradle-stage/，绝不触碰 release/；
 *   2. 只有 publishRelease（显式调用）才会把验证过的候选替换为正式发布文件；
 *   3. clean 只删 Gradle 自己的暂存目录，不删除 build/ 下的归档、备份与 release/。
 */

def repoRoot = rootDir
def buildRoot = layout.buildDirectory.get().asFile
def stageDir = new File(buildRoot, 'gradle-stage')
def reportDir = new File(buildRoot, 'gradle-reports')
def stageApk = new File(stageDir, '反物质维度.apk')
def releaseApk = file('release/反物质维度.apk')
// [R91] 发布身份链：verifyRelease 的 JSON 报告 + installToRelease 写出的清单。
// publishRelease 只接受清单里登记的那一个 release 产物，避免误发旧 R89/3.20。
def verifyReport = new File(reportDir, 'verify-release.json')
def releaseManifest = new File(buildRoot, 'release-manifest.json')
def deliveryArchive = new File(buildRoot, 'delivery_archive')

// ------------------------------------------------- [R76-G] Gradle 9 的 Exec 适配
//
// Gradle 9 移除了 `Task.exec {}`（Gradle 8 已弃用并告警，9 直接删）。
// 旧写法在 Gradle 8.10 上只是 warning，升到 9.8.2 后立刻变成
//   Could not find method exec() for arguments [...] on task ':verifyEnvironment'
// 这是真实 API 不兼容，不是环境问题。
//
// Gradle 9 的正确做法：项目级注入 ExecOperations，用它来起进程。
//   def execOps = project.services.get(ExecOperations)
//   execOps.exec { ... }
// 这样在任务行动（doLast）里也能用，且不依赖 Task 的已删方法。
import org.gradle.process.ExecOperations
import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.security.MessageDigest
def execOps = project.services.get(ExecOperations)

// 便捷包装：保持原来 `exec { ... }` 的闭包形态，内部走 ExecOperations。
def runExec = { Closure cfg ->
    execOps.exec(cfg)
}

// ---------------------------------------------------------------- 工具链发现
// 不写死个人绝对路径：JDK 在仓库内 tools/jdk/<任意版本>/，按目录扫描取最新。
//
// [R77] JDK 解析：Linux 由 Gradle 原生只读解析，Windows 暂保留 jdk_env.py。
// 这是第一批渐进迁移：不自动安装、不修改系统环境、不改变子进程继承的 JAVA_HOME。
// Linux 优先级保持为 JAVA_HOME → PATH → tools/jdk/*；Windows 继续复用 Python
// 的系统级 JAVA_HOME / Scoop 兼容逻辑，避免本轮扩大平台风险。
// [R96] Linux（Kubuntu 26.04）为主环境：解释器名与 adb 可执行文件按平台解析。
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def pythonExe = System.getenv('PYTHON') ?: (isWindows ? 'python' : 'python3')

def validJdk = { File home ->
    if (home == null) return false
    def javaName = isWindows ? 'java.exe' : 'java'
    def javacName = isWindows ? 'javac.exe' : 'javac'
    return new File(home, "bin/${javaName}").isFile() &&
        new File(home, "bin/${javacName}").isFile()
}

def stableJdk = { File home ->
    if (!validJdk(home)) return false
    def release = new File(home, 'release')
    if (!release.isFile()) return true
    def text = release.getText('UTF-8')
    def prerelease = java.util.regex.Pattern.compile(
        '\\b(alpha|beta|rc|ea|nightly|early-access|preview|snapshot)\\b',
        java.util.regex.Pattern.CASE_INSENSITIVE
    )
    return !prerelease.matcher(text).find()
}

def jdkFromPath = {
    def pathValue = System.getenv('PATH') ?: ''
    def javaName = isWindows ? 'java.exe' : 'java'
    for (String entry : pathValue.split(java.util.regex.Pattern.quote(File.pathSeparator))) {
        if (!entry?.trim()) continue
        def candidate = new File(entry, javaName)
        if (!candidate.isFile()) continue
        try {
            def real = candidate.canonicalFile
            def home = real.parentFile?.parentFile
            if (stableJdk(home)) return home
        } catch (Throwable ignored) {
        }
    }
    return null
}()

def jdkResolved = {
    if (isWindows) {
        // Windows 还需要读取系统级 JAVA_HOME 与 Scoop 目录，交给原有解析器。
        def out = new ByteArrayOutputStream()
        try {
            def r = execOps.exec {
                commandLine pythonExe, 'scripts/jdk_env.py', '--json', '--no-install'
                standardOutput = out
                errorOutput = out
                ignoreExitValue = true
            }
            if (r.exitValue == 0) {
                def txt = out.toString('UTF-8')
                def m = txt =~ /"home"\s*:\s*"([^"]+)"/
                if (m.find()) return new File(m.group(1))
            }
        } catch (Throwable ignored) {
        }
        return null
    }

    def envHome = System.getenv('JAVA_HOME')
    if (envHome) {
        def home = new File(envHome)
        if (stableJdk(home)) return home.canonicalFile
    }
    if (jdkFromPath != null) return jdkFromPath

    def bundled = file('tools/jdk')
    if (bundled.isDirectory()) {
        def candidates = bundled.listFiles()?.findAll { stableJdk(it) } ?: []
        if (candidates) return candidates.sort { it.name }.last().canonicalFile
    }
    return null
}()
def jdkHome = jdkResolved ?: {
    def base = file('tools/jdk')
    if (!base.isDirectory()) return null
    def cands = base.listFiles()?.findAll {
        it.isDirectory() && new File(it, 'bin/java.exe').exists()
    }
    return cands ? cands.sort { it.name }.last() : null
}()
// [R96] POSIX 的 JDK 里可执行文件叫 java（不是 java.exe）。
def javaExe = jdkHome ? new File(jdkHome, isWindows ? 'bin/java.exe' : 'bin/java') : null
def adbExe = { ->
    if (isWindows) return file('tools/platform-tools/adb.exe')
    def sdkHome = System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
    if (!sdkHome) sdkHome = new File(System.getProperty('user.home'), 'Android/Sdk').absolutePath
    def sdkAdb = new File(sdkHome, 'platform-tools/adb')
    if (sdkAdb.exists()) return sdkAdb
    def local = file('tools/platform-tools/adb')
    return local.exists() ? local : new File('adb')
}()
def apktoolJar = file('tools/apktool.jar')
// [R96] Windows 用随仓库的 tools/bt/android-14（.exe 套件）；Linux 用 SDK build-tools。
def btDir = {
    if (isWindows) return file('tools/bt/android-14')
    def sdkHome = System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
    if (!sdkHome) sdkHome = new File(System.getProperty('user.home'), 'Android/Sdk').absolutePath
    def bt = new File(sdkHome, 'build-tools')
    if (!bt.isDirectory()) return bt
    def dirs = bt.listFiles().findAll { it.isDirectory() }.sort { a, b -> b.name <=> a.name }
    for (d in dirs) { if (new File(d, 'zipalign').exists() || new File(d, 'zipalign.exe').exists()) return d }
    return dirs ? dirs[0] : bt
}()
// apktool 3.x 从 PATH 查找 aapt2。Linux 优先使用 34.0.0，避免新版 SDK
// 对反编译树中的历史资源名执行更严格的校验；Windows 沿用仓库工具。
def aapt2Dir = {
    if (isWindows) return btDir
    def sdkHome = System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
    if (!sdkHome) sdkHome = new File(System.getProperty('user.home'), 'Android/Sdk').absolutePath
    def root = new File(sdkHome, 'build-tools')
    if (!root.isDirectory()) return btDir
    def pinned = new File(root, '34.0.0')
    if (new File(pinned, 'aapt2').isFile()) return pinned
    def dirs = root.listFiles()?.findAll { it.isDirectory() }
        ?.findAll { new File(it, 'aapt2').isFile() }
        ?.sort { a, b -> b.name <=> a.name } ?: []
    return dirs ? dirs[0] : btDir
}()
def kotlinCompiler = file("tools/kotlinc/bin/${isWindows ? 'kotlinc.bat' : 'kotlinc'}")
def d8Exe = isWindows ? file('tools/bt/android-14/d8.bat') : new File(btDir, 'd8')
def kotlinStdlib = file('tools/kotlinc/lib/kotlin-stdlib.jar')
def androidJar = {
    def sdkHome = System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
    if (!sdkHome) sdkHome = new File(System.getProperty('user.home'), 'Android/Sdk').absolutePath
    def platforms = new File(sdkHome, 'platforms')
    def preferred = new File(platforms, 'android-34/android.jar')
    if (preferred.isFile()) return preferred
    def jars = platforms.listFiles()?.collect { new File(it, 'android.jar') }?.findAll { it.isFile() } ?: []
    return jars ? jars.sort { it.parentFile.name }.last() : new File('android.jar')
}()
def SMOKE_PKG = 'com.oreki.antimatterdimensions'
def keystore = file('keys/oreki.jks')

def signingPassword = {
    def value = System.getenv('OREKI_KS_PASS')
    if (value?.trim()) return value.trim()
    def passwordFile = file('keys/密码.txt')
    if (passwordFile.isFile()) {
        def text = passwordFile.getText('UTF-8').trim()
        if (text) return text
    }
    throw new GradleException('缺少签名口令：请设置 OREKI_KS_PASS，或提供 keys/密码.txt')
}

def pkgName = 'com.oreki.antimatterdimensions'

// ======================================================= [R76] 唯一基线选择入口
//
// 背景：之前基线是隐式的 —— build_mod.py 读 work/base_decoded，
// 而 build.gradle 里把期望版本写死成 3.19.0 / 30190000。一旦切换到 3.20 基线，
// verifyEnvironment 会拿旧值去校验新基线，直接误报；指纹也不包含基线切换，
// 于是「换了基线 Gradle 仍认为 UP-TO-DATE」⇒ 静默产出旧基线的包。
//
// 现在统一规则：
//   1. 基线目录只能由 OREKI_BASE 环境变量或 -PorekiBase=... 指定这一处决定；
//   2. 期望的 versionName / versionCode / package 一律**从该基线的 apktool.yml
//      与 AndroidManifest.xml 真实读取**，不再写死；
//   3. 同一个值同时喂给 verifyEnvironment、assembleRelease 的环境变量、
//      Rust fingerprint 与 verify_release.py，四处不再各自读文件。
// [R91] 默认基线不再写死 work/base_decoded（那是 3.19）。
// 正式发布链必须默认当前版本：baseline/version-config.json 的 current +
// decoded_tree。显式 -PorekiBase / OREKI_BASE 仍可覆盖（迁移验证用），
// 但未指定时绝不允许静默退回旧基线。
def baselineConfigFile = file('baseline/version-config.json')
if (!baselineConfigFile.isFile()) {
    throw new GradleException("缺少基线版本配置：${baselineConfigFile}（R91 发布链要求 fail-closed）")
}
def baselineConfig = new JsonSlurper().parse(baselineConfigFile)
def currentBaselineVersion = baselineConfig.current
def currentBaselineCfg = baselineConfig.versions?.get(currentBaselineVersion)
if (!currentBaselineCfg?.decoded_tree) {
    throw new GradleException("baseline/version-config.json 缺少 current=${currentBaselineVersion} 的 decoded_tree")
}
def defaultBaseTree = currentBaselineCfg.decoded_tree.toString()
def resolveBaseDir = {
    def fromProp = project.findProperty('orekiBase')
    def fromEnv = System.getenv('OREKI_BASE')
    def raw = fromProp ?: fromEnv ?: defaultBaseTree
    return file(raw)
}
def baseDir = resolveBaseDir()
def baseDecoded = new File(baseDir, '')   // 规范化

// Rust 工具：Release 产物阶段使用 normalize-zip；它也负责 APK 指纹、包信息和 DEX
// 布局等原生校验。源码未变化时 buildBaselineTool 由 Gradle 增量跳过，避免重复编译。
def baselineToolDir = file('baseline/tools')
def baselineToolExe = new File(baselineToolDir, isWindows ? 'target/release/baseline.exe' : 'target/release/baseline')

// 从基线真实读取版本信息（apktool.yml 优先，缺了再看 AndroidManifest）
def readBaseMeta = { File dir ->
    def yml = new File(dir, 'apktool.yml')
    def meta = [versionName: null, versionCode: null, pkg: null, ok: false]
    if (!yml.isFile()) {
        return meta
    }
    def txt = yml.getText('UTF-8')
    def mName = txt =~ /(?m)^\s*versionName:\s*'?([^'\r\n]+)'?/
    def mCode = txt =~ /(?m)^\s*versionCode:\s*'?(\d+)'?/
    if (mName.find()) meta.versionName = mName.group(1).trim()
    if (mCode.find()) meta.versionCode = mCode.group(1).trim()
    def man = new File(dir, 'AndroidManifest.xml')
    if (man.isFile()) {
        def mtxt = man.getText('UTF-8')
        def mp = mtxt =~ /package="([^"]+)"/
        if (mp.find()) meta.pkg = mp.group(1)
    }
    meta.ok = (meta.versionName != null && meta.versionCode != null)
    return meta
}
def baseMeta = readBaseMeta(baseDecoded)
def expectVersionName = baseMeta.versionName
def expectVersionCode = baseMeta.versionCode
def avdName = 'oreki_test'

// ------------------------------------------------------- 简易任务日志工具
ext.step = { String msg -> logger.lifecycle("[oreki] ${msg}") }

// =========================================================== verifyEnvironment
tasks.register('verifyEnvironment') {
    group = 'oreki'
    description = '检查 JDK / Python / apktool / build-tools / 签名 / ADB / 反编译输入树是否就绪'
    doLast {
        def rows = []
        def add = { String name, boolean ok, String detail ->
            rows << [name: name, ok: ok, detail: detail]
        }

        add('jdk', javaExe != null && javaExe.exists(),
            javaExe ? javaExe.absolutePath : 'tools/jdk 下未找到 JDK（需要 bin/java.exe）')

        def pyVer = ''
        def pyOk = false
        try {
            def out = new ByteArrayOutputStream()
            runExec {
                commandLine pythonExe, '--version'
                standardOutput = out
                errorOutput = out
                ignoreExitValue = true
            }
            pyVer = out.toString('UTF-8').trim()
            pyOk = pyVer.toLowerCase().contains('python')
        } catch (Exception e) {
            pyVer = e.message
        }
        add('python', pyOk, "${pythonExe} -> ${pyVer}")

        add('apktool.jar', apktoolJar.exists(),
            apktoolJar.exists() ? apktoolJar.absolutePath : '缺 tools/apktool.jar')

        def zipalignName = isWindows ? 'zipalign.exe' : 'zipalign'
        def btOk = new File(btDir, zipalignName).exists() && new File(btDir, 'lib/apksigner.jar').exists()
        add('build-tools', btOk, btDir.absolutePath)

        add('keystore', keystore.exists(),
            keystore.exists() ? "keys/oreki.jks（口令走 OREKI_KS_PASS 或 keys/密码.txt）" : '缺 keys/oreki.jks')

        add('adb', adbExe.exists(), adbExe.exists() ? adbExe.absolutePath : '缺 tools/platform-tools/adb.exe')

        // [R76] 基线来自唯一入口（OREKI_BASE / -PorekiBase），并校验真实版本
        def baseOk = new File(baseDecoded, 'apktool.yml').isFile()
        add('base_decoded', baseOk,
            baseOk ? "${baseDecoded.absolutePath} 就绪（versionName=$expectVersionName, versionCode=$expectVersionCode）"
                   : "缺 ${baseDecoded.absolutePath}（按 tools/README.md 反编译原始 XAPK 重建）")
        if (baseOk) {
            add('base_version', baseMeta.versionName != null && baseMeta.versionCode != null,
                baseMeta.ok ? "基线自述 ${baseMeta.versionName} / ${baseMeta.versionCode} / ${baseMeta.pkg ?: '?'}"
                            : 'apktool.yml 里读不到 versionName/versionCode')
        }

        def splitOk = file('work/xhdpi_decoded').isDirectory()
        add('xhdpi_split', splitOk, splitOk ? 'work/xhdpi_decoded 就绪' : '缺 work/xhdpi_decoded（config.xhdpi 反编译树）')

        add('payload', file('scripts/payload').isDirectory(), 'scripts/payload 手工 smali/资源补丁')

        // 只报告，不阻断：可能本轮不打算跑安装/冒烟
        def devOut = ''
        def devOnline = false
        try {
            def out = new ByteArrayOutputStream()
            runExec {
                commandLine adbExe, 'devices'
                standardOutput = out
                errorOutput = out
                ignoreExitValue = true
            }
            devOut = out.toString('UTF-8').readLines().findAll { it.contains('\tdevice') }.join(' | ')
            devOnline = devOut
        } catch (Exception e) {
            devOut = e.message
        }

        reportDir.mkdirs()
        new File(reportDir, 'verify-environment.json').text = groovy.json.JsonOutput.toJson(rows)

        rows.each { r -> logger.lifecycle(String.format('  %-14s %s  %s', r.name, r.ok ? 'OK  ' : 'FAIL', r.detail)) }
        logger.lifecycle("  ${'-' * 60}")
        logger.lifecycle("  AVD(${avdName}): " + (devOnline ? "在线 ${devOut}" : '不在线（仅 installOrekiTest / smokeOrekiTest 需要）'))

        def failed = rows.findAll { !it.ok }
        if (failed) {
            throw new GradleException('环境检查未通过：' + failed.collect { it.name }.join(', '))
        }
    }
}

// ================================================================ Kotlin/D8 构建阶段
// [R76] Kotlin 编译接入发布依赖链。
//
// 背景：R75 加了 scripts/build_kotlin.py，但**没有任何 Gradle 任务调用它** ——
// 只有手工跑过才有 build/kt/classes.dex。于是 clean 之后直接 assembleRelease，
// 会拿到「没有 Kotlin dex」的包；更糟的是 build_mod 当时只要看见 .kt 源就删
// Smali 版，等于产出缺实现的 APK。
//
// 现在：
//   · Gradle 负责 kotlinc / javap / D8 的工具编排与输入输出；
//   · Python 只保留基线绑定生成和 ABI 语义守卫；
//   · 任一阶段失败 = 任务失败 = 不产出 APK（而不是静默退回）。
def kotlinEnv = {
    def e = [:]
    if (jdkHome != null) {
        e['JAVA_HOME'] = jdkHome.absolutePath
        e['PATH'] = jdkHome.absolutePath + File.separator + 'bin' + File.pathSeparator + System.getenv('PATH')
    }
    e['PYTHONIOENCODING'] = 'utf-8'
    return e
}()

tasks.register('generateKotlinBindings', Exec) {
    group = 'oreki'
    description = '由 Python 生成已确认基线绑定的 Kotlin 源文件'
    workingDir = repoRoot
    commandLine pythonExe, 'scripts/build_kotlin.py', '--generate-bindings'
    kotlinEnv.each { k, v -> environment k, v }
    inputs.file(new File(repoRoot, 'baseline/version-config.json'))
    outputs.file(new File(repoRoot, 'build/kt/generated/OrekiBaselineBindings.kt'))
}

tasks.register('compileKotlinClasses', Exec) {
    group = 'oreki'
    description = '用仓库 Kotlin 编译器编译 MOD Kotlin 源码'
    dependsOn 'generateKotlinBindings'
    workingDir = repoRoot
    doFirst {
        def out = new File(repoRoot, 'build/kt/classes')
        if (out.exists()) delete out
        out.mkdirs()
    }
    commandLine kotlinCompiler, '-nowarn', '-classpath', androidJar.absolutePath
    fileTree(new File(repoRoot, 'scripts/payload/kotlin')) { include '**/*.kt' }.files.sort { it.path }.each { args it.absolutePath }
    args new File(repoRoot, 'build/kt/generated/OrekiBaselineBindings.kt').absolutePath,
        '-d', new File(repoRoot, 'build/kt/classes').absolutePath
    kotlinEnv.each { k, v -> environment k, v }
    inputs.dir(new File(repoRoot, "scripts/payload/kotlin"))
    inputs.file(new File(repoRoot, "build/kt/generated/OrekiBaselineBindings.kt"))
    inputs.file(androidJar)
    inputs.files(fileTree(new File(repoRoot, "tools/kotlinc/lib")) { include "*.jar" })
    outputs.dir(new File(repoRoot, "build/kt/classes"))
}

tasks.register('verifyKotlinAbi', Exec) {
    group = 'oreki'
    description = '复用 Python 语义守卫校验已编译 Kotlin ABI'
    dependsOn 'compileKotlinClasses'
    workingDir = repoRoot
    commandLine pythonExe, 'scripts/build_kotlin.py', '--verify-abi',
        '--classes', new File(repoRoot, 'build/kt/classes').absolutePath
    kotlinEnv.each { k, v -> environment k, v }
    inputs.dir(new File(repoRoot, 'build/kt/classes'))
}

tasks.register('buildKotlinDex') {
    group = 'oreki'
    description = '用 D8 将已通过 ABI 守卫的 Kotlin classes 编成 dex'
    dependsOn 'verifyKotlinAbi'
    // [R102] 类文件列表必须在**执行期**收集：改成 Exec 任务时 commandLine/args 在配置期
    // 求值，干净 checkout 里 build/kt/classes 还不存在，D8 会收到 0 个 class files，
    // 产出的 dex 只有 Kotlin 标准库（R39 类描述符校验因此正确拒绝构建）。
    inputs.dir(new File(repoRoot, "build/kt/classes"))
    inputs.file(androidJar)
    inputs.file(kotlinStdlib)
    outputs.file(new File(repoRoot, "build/kt/classes.dex"))
    doLast {
        def out = new File(repoRoot, 'build/kt')
        def dex = new File(out, 'classes.dex')
        if (dex.exists()) dex.delete()
        out.mkdirs()
        def classFiles = fileTree(new File(repoRoot, 'build/kt/classes')) { include '**/*.class' }
            .files.sort { it.path }
        if (classFiles.isEmpty()) {
            throw new GradleException('build/kt/classes 为空：Kotlin 编译产物缺失，拒绝生成空 dex')
        }
        def cmd = [d8Exe.absolutePath, '--lib', androidJar.absolutePath, '--min-api', '29',
                   '--output', out.absolutePath]
        classFiles.each { cmd << it.absolutePath }
        if (kotlinStdlib.isFile()) cmd << kotlinStdlib.absolutePath
        step("D8 输入 class 文件：${classFiles.size()} 个")
        execOps.exec {
            workingDir = repoRoot
            commandLine cmd
            kotlinEnv.each { k, v -> environment k, v }
        }
    }
}

// ============================================================== fingerprintInputs
// [R66] 构建输入指纹：决定 assembleRelease 能否安全跳过。
//
// 为什么不用 Gradle 原生的 inputs.dir()：
//   反编译基线树 work/base_decoded 有 27744 个文件 / 0.40 GB，**从不修改**；
//   对它做内容哈希是纯浪费。而真正会变的只有 scripts/payload（35 个文件）
//   和 scripts/*.py（69 个）。Rust 基线工具负责**分级指纹**：
//     · 小而常变的 → 内容 sha256（payload / 脚本 / gradle 编排文件）
//     · 大而只读的 → (路径, 体积, mtime) 滚动哈希（基线树 / 原始 APK / keystore）
//   实测单次指纹约 4.4 秒（含基线树 4.2 秒），相对 8.5 分钟的完整构建可忽略。
//
// 安全阀：候选 APK 不存在 → 一律 stale；指纹文件缺失/损坏 → stale；
//         -PorekiForceBuild=1 → 直接强制构建（发布链路用）。
def staleFlag = file("$buildDir" + "/.build_stale")
def fingerprintArgs = { String mode ->
    [baselineToolExe.absolutePath, 'fingerprint', '--repo', repoRoot.absolutePath,
     '--base', baseDecoded.absolutePath, '--stage-apk', stageApk.absolutePath,
     '--flag', staleFlag.absolutePath, '--fingerprint', new File(buildDir, '.input_fingerprint.json').absolutePath,
     '--mode', mode, '--release-out', System.getenv('OREKI_RELEASE_OUT') ?: '',
     '--tutorial-allow-draft', System.getenv('OREKI_TUTORIAL_ALLOW_DRAFT') ?: '']
}

// [R66] 发布链路一律强制真实构建：增量跳过只服务开发期，绝不用于对外发布。
// 必须在任务图确定、但**尚未开始执行**时决定 —— 写在 publishRelease 的 doFirst 里
// 是无效的，因为依赖任务（assembleRelease）在那之前就已经跑完了。
def forceFullBuild = false
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':publishRelease') || graph.hasTask(':installToRelease')) {
        forceFullBuild = true
        step("发布链路（publishRelease/installToRelease）：强制 assembleRelease 真实执行")
    }
}

// ===================================================== [R99] APK assembly migration
// build_mod.py 只负责生成并校验补丁后的 apktool 树；下面的产物编排由 Gradle
// 直接执行。先保留 Python 旧路径作为显式回退，待新路径完成一次真实产物校验后删除。
def modTree = {
    def raw = System.getenv('OREKI_MOD')
    return file(raw?.trim() ? raw : 'work/mod')
}()
def patchedUnsigned = new File(stageDir, 'unsigned.apk')
def selectedBaselineMeta = readBaseMeta(baseDecoded)
def selectedBaselineKey = selectedBaselineMeta.versionName ? selectedBaselineMeta.versionName.toString().take(4) : currentBaselineVersion
def selectedBaselineCfg = baselineConfig.versions?.get(selectedBaselineKey) ?: currentBaselineCfg
// [R101 P0] 原版页签业务门禁的 Gradle 构建注入器。
// Python 只生成补丁树；业务判定在 Kotlin，Gradle 这里只插入 ABI 转发。
def injectR101EternityTabGate = {
    def bm4 = new File(modTree, 'smali_classes2/bm4.smali')
    if (!bm4.isFile()) throw new GradleException("R101 P0 缺少原版页签类：${bm4}")
    def src = bm4.getText('UTF-8').replace('\r\n', '\n')
    if (src.contains('R101P0_TAB_GATE')) return

    // 原版底部动作区把 ETERNITY 作为普通 BottomButtonID.b 处理，
    // 只按无限点数/反物质判断可见性；这会在首次永恒前仍显示“永恒”圆钮。
    // 这里仅注入 ABI 转发，真正阶段判定仍由 Kotlin 完成。
    def bottomButtons = new File(modTree, 'smali_classes2/kajfosz/antimatterdimensions/mainactivity/l0.smali')
    if (!bottomButtons.isFile()) throw new GradleException("R101 P0 缺少原版底部动作区类：${bottomButtons}")
    def bottomSrc = bottomButtons.getText('UTF-8').replace('\r\n', '\n')
    if (!bottomSrc.contains('R101P0_ETERNNITY_ACTION_GATE')) {
        def bottomAnchor = "    move-result v4\n\n    .line 114\n    if-eqz v4, :cond_6\n"
        if (bottomSrc.count(bottomAnchor) != 1) throw new GradleException('R101 P0 BottomButtonID.b 可见性锚点不唯一')
        bottomSrc = bottomSrc.replace(bottomAnchor,
            "    move-result v4\n\n" +
            "    # [R101P0_ETERNNITY_ACTION_GATE] 永恒动作按钮的业务可见性由 Kotlin 判定\n" +
            "    const-string v5, \"eternity\"\n" +
            "    invoke-static {v5}, Lkajfosz/antimatterdimensions/oreki/OrekiStageAuto;->vanillaEternityTabAllowed(Ljava/lang/String;)Z\n" +
            "    move-result v5\n" +
            "    and-int/2addr v4, v5\n\n" +
            "    .line 114\n" +
            "    if-eqz v4, :cond_6\n")
        bottomButtons.setText(bottomSrc, 'UTF-8')
    }

    def gAnchor = ".method public final g()Z\n    .locals 7\n\n"
    if (src.count(gAnchor) != 1) throw new GradleException('R101 P0 bm4.g() 锚点不唯一')
    def gInject = gAnchor +
        "    # [R101P0_TAB_GATE] 页签业务门槛交给 Kotlin\n" +
        "    iget-object v0, p0, Luo4;->b:Ljava/lang/String;\n" +
        "    invoke-static {v0}, Lkajfosz/antimatterdimensions/oreki/OrekiStageAuto;->vanillaEternityTabAllowed(Ljava/lang/String;)Z\n" +
        "    move-result v0\n" +
        "    if-eqz v0, :oreki_r101_tab_locked\n" +
        "    goto :oreki_r101_tab_original\n" +
        "    :oreki_r101_tab_locked\n" +
        "    const/4 v0, 0x0\n" +
        "    return v0\n" +
        "    :oreki_r101_tab_original\n\n"
    src = src.replace(gAnchor, gInject)

    def hAnchor = ".method public final h(Z)V\n    .locals 0\n"
    if (src.count(hAnchor) != 1) throw new GradleException('R101 P0 bm4.h() 锚点不唯一')
    def hInject = ".method public final h(Z)V\n    .locals 1\n\n" +
        "    # [R101P0_TAB_GATE] 禁止非法页签程序选择\n" +
        "    iget-object v0, p0, Luo4;->b:Ljava/lang/String;\n" +
        "    invoke-static {v0}, Lkajfosz/antimatterdimensions/oreki/OrekiStageAuto;->vanillaEternityTabAllowed(Ljava/lang/String;)Z\n" +
        "    move-result v0\n" +
        "    if-eqz v0, :oreki_r101_tab_select_locked\n" +
        "    goto :oreki_r101_tab_select_original\n" +
        "    :oreki_r101_tab_select_locked\n" +
        "    return-void\n" +
        "    :oreki_r101_tab_select_original\n"
    src = src.replace(hAnchor, hInject)

    // 父级底部导航由 ll2.g() 决定，原版此处只检查 Luo4.c()，不会调用子页签 bm4.g()。
    // 同样转发到 Kotlin，避免永恒父级入口绕过业务门禁。
    def ll2 = new File(modTree, 'smali_classes2/ll2.smali')
    if (!ll2.isFile()) throw new GradleException("R101 P0 缺少原版导航分组类：${ll2}")
    def ll2Src = ll2.getText('UTF-8').replace('\r\n', '\n')
    if (!ll2Src.contains('R101P0_CATEGORY_GATE')) {
        def ll2Anchor = ".method public final g()Z\n    .locals 7\n\n"
        if (ll2Src.count(ll2Anchor) != 1) throw new GradleException('R101 P0 ll2.g() 锚点不唯一')
        def ll2Inject = ll2Anchor +
            "    # [R101P0_CATEGORY_GATE] 父级导航分组门槛交给 Kotlin\n" +
            "    iget-object v0, p0, Luo4;->b:Ljava/lang/String;\n" +
            "    invoke-static {v0}, Lkajfosz/antimatterdimensions/oreki/OrekiStageAuto;->vanillaEternityTabAllowed(Ljava/lang/String;)Z\n" +
            "    move-result v0\n" +
            "    if-eqz v0, :oreki_r101_category_locked\n" +
            "    goto :oreki_r101_category_original\n" +
            "    :oreki_r101_category_locked\n" +
            "    const/4 v0, 0x0\n" +
            "    return v0\n" +
            "    :oreki_r101_category_original\n\n"
        ll2Src = ll2Src.replace(ll2Anchor, ll2Inject)
        ll2.setText(ll2Src, 'UTF-8')
    }

    // 原版恢复路径直接调用 MainActivity.W8()，不会经过 bm4.h()；
    // 在这里把非法的永恒页签选择回退到普通反物质维度页，保持侧栏/底栏完整。
    def w8Anchor = ".method public final W8(Lbm4;ZZ)V\n    .locals 10\n\n"
    def mainActivity = new File(modTree, 'smali_classes2/kajfosz/antimatterdimensions/MainActivity.smali')
    if (!mainActivity.isFile()) throw new GradleException("R101 P0 缺少页面路由类：${mainActivity}")
    def mainSrc = mainActivity.getText('UTF-8').replace('\r\n', '\n')
    if (mainSrc.count(w8Anchor) != 1) throw new GradleException('R101 P0 MainActivity.W8() 锚点不唯一')
    def w8Inject = w8Anchor +
        "    # [R101P0_RESTORE_GATE] 页面恢复也必须经过 Kotlin 业务门禁\n" +
        "    if-eqz p1, :oreki_r101_restore_original\n" +
        "    # bm4.i 是图标/内部标识；Luo4.b 才是稳定业务页签键\n" +
        "    iget-object v0, p1, Luo4;->b:Ljava/lang/String;\n" +
        "    invoke-static {v0}, Lkajfosz/antimatterdimensions/oreki/OrekiStageAuto;->vanillaEternityTabAllowed(Ljava/lang/String;)Z\n" +
        "    move-result v0\n" +
        "    if-eqz v0, :oreki_r101_restore_fallback\n" +
        "    goto :oreki_r101_restore_original\n" +
        "    :oreki_r101_restore_fallback\n" +
        "    sget-object p1, Ljp4;->b:Lbm4;\n" +
        "    :oreki_r101_restore_original\n\n"
    mainSrc = mainSrc.replace(w8Anchor, w8Inject)

    // [R103 P0-01] 这里是 R101 加过的「创建时过滤永恒父级」注入点，R103 已删除。
    //
    // 原因（真实 AVD 复现）：MainActivity 在 onCreate 阶段就遍历 jp4.f0[] 建父级分组，
    // 此时存档还没加载完，OrekiStageAuto.vanillaEternityUnlocked() 读到 ep/bigE/升级位图
    // 全为 0，于是 "eternity" 分组被永久跳过；之后即使合法永恒存档加载完成，
    // 该分组也不会再被创建 —— 实测 et=1 与 et=25 的合法存档冷启动后侧栏/底栏都没有
    // 「永恒」入口，时间研究不可达（官方 3.21 同档有）。
    //
    // 正确做法：照原版创建全部父级分组，让已有的每帧可见性刷新（l0 里调用 ll2.g()）
    // 在存档加载后决定显示/隐藏；ll2.g() 上的 R101P0_CATEGORY_GATE 仍然保证
    // 首次永恒真实结算前隐藏「永恒」分组。这里不再做任何创建期过滤，也不写存档。

    // onCreate() 先把 currentSubTab 写入 jp4.d0，后续页面创建会直接消费该静态对象，
    // 因而即使 W8() 回退，仍可能从旧 SharedPreferences 恢复到永恒子页。这里在真实
    // 状态恢复点复用同一个 Kotlin 页签判据，非法父级直接回退到反物质维度。
    def currentSubTabAnchor = "    sput-object v5, Ljp4;->d0:Lbm4;\n"
    if (mainSrc.count(currentSubTabAnchor) != 1) throw new GradleException('R101 P0 currentSubTab 恢复锚点不唯一')
    def currentSubTabInject =
        "    # [R101P0_CURRENT_SUBTAB_GATE] currentSubTab 静态恢复也必须经过 Kotlin 业务门禁\n" +
        "    iget-object v6, v5, Luo4;->b:Ljava/lang/String;\n" +
        "    invoke-static {v6}, Lkajfosz/antimatterdimensions/oreki/OrekiStageAuto;->vanillaEternityTabAllowed(Ljava/lang/String;)Z\n" +
        "    move-result v6\n" +
        "    if-eqz v6, :oreki_r101_current_subtab_fallback\n" +
        "    goto :oreki_r101_current_subtab_original\n" +
        "    :oreki_r101_current_subtab_fallback\n" +
        "    sget-object v5, Ljp4;->b:Lbm4;\n" +
        "    :oreki_r101_current_subtab_original\n" +
        currentSubTabAnchor
    mainSrc = mainSrc.replace(currentSubTabAnchor, currentSubTabInject)
    mainActivity.setText(mainSrc, 'UTF-8')
    bm4.setText(src, 'UTF-8')
    if (!bm4.getText('UTF-8').contains('oreki_r101_tab_select_locked') ||
        !bottomButtons.getText('UTF-8').contains('R101P0_ETERNNITY_ACTION_GATE') ||
        !mainActivity.getText('UTF-8').contains('oreki_r101_restore_fallback') ||
        !ll2.getText('UTF-8').contains('oreki_r101_category_locked') ||
        !mainActivity.getText('UTF-8').contains('oreki_r101_current_subtab_fallback')) {
        throw new GradleException('R101 P0 页签/恢复门禁注入失败')
    }
    logger.lifecycle('[R101 P0] Gradle 已注入 bm4.g()/h() 与 MainActivity.W8() Kotlin 页签业务门禁')
}
def assembleApktoolTree = {
    if (selectedBaselineCfg.move_ads_package) {
        def source = new File(modTree, 'smali/com/google/android/gms/internal/ads')
        def target = new File(modTree, 'smali_classes3/com/google/android/gms/internal/ads')
        if (source.isDirectory()) {
            if (target.exists()) throw new GradleException("广告依赖目标已存在，拒绝覆盖：${target}")
            target.parentFile.mkdirs()
            java.nio.file.Files.move(source.toPath(), target.toPath())
            logger.lifecycle('[oreki] 已将广告依赖包分组到 classes3.dex')
        }
    }
    // [R101] Universal APK：把官方 ABI 的 native 库并入 APK，并声明解压安装。
    //  来源可验证：armeabi-v7a 两个 .so 与官方 XAPK split 逐字节一致；
    //  arm64-v8a/x86/x86_64 取自同一 Maven AAR 的同版本产物。
    //  extractNativeLibs 必须为 true：压缩存放的 .so 在 false 时安装报
    //  INSTALL_FAILED_INVALID_APK: Failed to extract native libraries (res=-2)。
    def payloadLib = new File(repoRoot, 'scripts/payload/lib')
    if (payloadLib.isDirectory()) {
        int copied = 0
        payloadLib.eachDir { abiDir ->
            def dest = new File(modTree, "lib/${abiDir.name}")
            dest.mkdirs()
            abiDir.eachFile { f ->
                if (f.name.endsWith('.so')) {
                    java.nio.file.Files.copy(f.toPath(), new File(dest, f.name).toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    copied++
                }
            }
        }
        if (copied == 0) throw new GradleException('payload/lib 下没有找到任何 .so，拒绝产出无 native 库的 Universal APK')
        logger.lifecycle("[oreki] 已并入 native 库 ${copied} 个：${payloadLib.list().sort().join(', ')}")
        def mf = new File(modTree, 'AndroidManifest.xml')
        def text = mf.getText('UTF-8')
        if (text.contains('android:extractNativeLibs="false"')) {
            mf.setText(text.replace('android:extractNativeLibs="false"', 'android:extractNativeLibs="true"'), 'UTF-8')
            logger.lifecycle('[oreki] extractNativeLibs: false -> true')
        } else if (!text.contains('android:extractNativeLibs=')) {
            mf.setText(text.replaceFirst('<application ', '<application android:extractNativeLibs="true" '), 'UTF-8')
            logger.lifecycle('[oreki] extractNativeLibs: 缺失 -> 写入 true')
        }
    } else {
        throw new GradleException("缺少 ${payloadLib}，无法产出 Universal APK")
    }
    def tmp = new File(buildRoot, "apktool-tmp-${ProcessHandle.current().pid()}")
    tmp.mkdirs()
    def apktoolEnv = new HashMap(System.getenv())
    apktoolEnv['TEMP'] = tmp.absolutePath
    apktoolEnv['TMP'] = tmp.absolutePath
    def apktoolPath = aapt2Dir.absolutePath + File.pathSeparator + System.getenv('PATH')
    if (jdkHome != null) apktoolPath = jdkHome.absolutePath + File.separator + 'bin' + File.pathSeparator + apktoolPath
    apktoolEnv['PATH'] = apktoolPath
    if (patchedUnsigned.exists()) patchedUnsigned.delete()
    execOps.exec {
        environment apktoolEnv
        commandLine javaExe.absolutePath, "-Djava.io.tmpdir=${tmp.absolutePath}", '-Xmx6g',
            '-jar', apktoolJar.absolutePath, 'b', modTree.absolutePath, '-o', patchedUnsigned.absolutePath
    }
    if (!patchedUnsigned.isFile()) throw new GradleException("apktool 未生成 unsigned APK：${patchedUnsigned}")
}
def injectKotlinDex = { File apk ->
    def ktDex = new File(buildRoot, 'kt/classes.dex')
    if (!ktDex.isFile()) {
        logger.lifecycle('[oreki] 未找到 Kotlin dex，跳过注入（沿用 Smali 实现）')
        return
    }
    runExec {
        workingDir = baselineToolDir
        commandLine baselineToolExe.absolutePath, 'inject-dex', '--apk', apk.absolutePath, '--dex', ktDex.absolutePath
    }
}
def verifyAssembledAssets = { File apk ->
    def z = new java.util.zip.ZipFile(apk)
    try {
        def names = z.entries().toList()*.name
        ['assets/oreki_tutorial.txt', 'assets/fonts/fa-solid-900.ttf', 'assets/dexopt/baseline.prof'].each { name ->
            def entry = z.getEntry(name)
            if (entry == null || entry.size <= 0) throw new GradleException("APK 缺少有效资源：${name}")
        }
        def assetCount = names.count { it.startsWith('assets/') }
        if (assetCount < 22) throw new GradleException("APK assets 只有 ${assetCount} 条，至少应有 22 条")
        logger.lifecycle("[oreki] APK assets 校验通过：${assetCount} 条")
    } finally { z.close() }
}

tasks.register('fingerprintInputs', Exec) {
    group = 'oreki'
    description = '计算构建输入指纹，决定 assembleRelease 是 UP-TO-DATE 还是必须重建'
    workingDir = repoRoot
    commandLine(*fingerprintArgs('check'))
    // [R77] 统一 JDK：让 Python 及其子进程（D8/apktool/kotlinc）
    // 继承与 Gradle 同一个 JDK，避免「Gradle 用 A、D8 用 B」。
    if (jdkHome != null) {
        environment 'JAVA_HOME', jdkHome.absolutePath
        environment 'PATH', jdkHome.absolutePath + File.separator + 'bin' + File.pathSeparator + System.getenv('PATH')
    }
    environment 'PYTHONIOENCODING', 'utf-8'
    // [R91] 指纹必须和构建使用同一份基线；候选输出目录由 Gradle 固定管理。
    environment 'OREKI_BASE', baseDecoded.absolutePath
    // 它自己每次都要真实跑一遍（读文件系统状态），不能被 Gradle 跳过
    outputs.upToDateWhen { false }
}

// ============================================================== assembleRelease
// 真实调用 scripts/build_mod.py；Python 只产出已注入 Kotlin dex 且已规整 ZIP 的 unsigned APK，
// Gradle 随后直接调用 zipalign/apksigner，最终候选仍只落在 build/gradle-stage/。
tasks.register('assembleRelease', Exec) {
    group = 'oreki'
    description = '用 smali/apktool 流水线生成并由 Gradle 对齐/签名候选 APK（不触碰 release/）'
    dependsOn 'verifyEnvironment', 'fingerprintInputs', 'buildKotlinDex', 'buildBaselineTool'
    workingDir = repoRoot
    commandLine pythonExe, 'scripts/build_mod.py'
    environment 'OREKI_GRADLE_ASSEMBLY', '1'
    // [R77] 统一 JDK：让 Python 及其子进程（D8/apktool/kotlinc）
    // 继承与 Gradle 同一个 JDK，避免「Gradle 用 A、D8 用 B」。
    def buildPath = aapt2Dir.absolutePath + File.pathSeparator + System.getenv('PATH')
    if (jdkHome != null) {
        environment 'JAVA_HOME', jdkHome.absolutePath
        buildPath = jdkHome.absolutePath + File.separator + 'bin' + File.pathSeparator + buildPath
    }
    environment 'PATH', buildPath
    environment 'PYTHONIOENCODING', 'utf-8'
    // [R76] 基线唯一入口：把 gradle 解析出的绝对路径喂给 build_mod.py，
    // 避免「gradle 校验 A 基线、build_mod 却打 B 基线」的分叉。
    environment 'OREKI_BASE', baseDecoded.absolutePath
    // [R80] 补丁工作目录也可指定，避免与其它树互相覆盖。
    // 默认不设 = build_mod.py 用 work/mod（历史行为不变）。
    def modDirEnv = System.getenv('OREKI_MOD')
    if (modDirEnv != null && !modDirEnv.trim().isEmpty()) {
        environment 'OREKI_MOD', new File(modDirEnv).absolutePath
    }
    doFirst {
        stageDir.mkdirs()
        [stageApk, new File(stageDir, 'unsigned.apk'), new File(stageDir, 'aligned.apk'),
         new File(stageDir, 'signed_staged.apk')].each { if (it.exists()) it.delete() }
        // 防止旧候选被误当本轮产物
        step("候选输出目录: ${stageDir}")
    }
    // [R66] 增量判定：输入指纹一致且候选 APK 仍在 → 跳过（Gradle 显示 SKIPPED）。
    // 注意 doFirst 只在真正执行时运行，所以「跳过」不会误删候选产物。
    onlyIf { forceFullBuild || project.hasProperty('orekiForceBuild') || staleFlag.exists() }
    // 构建成功之后才提交新指纹：失败不会污染下一次的判定基准。
    doLast {
        def unsigned = new File(stageDir, 'unsigned.apk')
        def aligned = new File(stageDir, 'aligned.apk')
        def signed = new File(stageDir, 'signed_staged.apk')
        def zipalign = new File(btDir, isWindows ? 'zipalign.exe' : 'zipalign')
        injectR101EternityTabGate()
        assembleApktoolTree()
        injectKotlinDex(unsigned)
        runExec {
            workingDir = baselineToolDir
            commandLine baselineToolExe.absolutePath, 'normalize-zip', '--apk', unsigned.absolutePath
        }
        verifyAssembledAssets(unsigned)
        if (!unsigned.isFile()) throw new GradleException("Gradle 未生成 unsigned APK：${unsigned}")

        runExec {
            commandLine zipalign.absolutePath, '-p', '-f', '4', unsigned.absolutePath, aligned.absolutePath
        }
        if (!aligned.isFile()) throw new GradleException("zipalign 未生成：${aligned}")

        def pass = 'pass:' + signingPassword()
        runExec {
            commandLine javaExe.absolutePath, '-jar', new File(btDir, 'lib/apksigner.jar').absolutePath,
                'sign', '--ks', keystore.absolutePath, '--ks-key-alias', 'oreki',
                '--ks-pass', pass, '--key-pass', pass,
                '--v1-signing-enabled', 'true', '--v2-signing-enabled', 'true',
                '--v3-signing-enabled', 'true', '--out', signed.absolutePath, aligned.absolutePath
        }
        if (!signed.isFile() || signed.length() < aligned.length()) {
            throw new GradleException("apksigner 产物无效：signed=${signed.length()} aligned=${aligned.length()}")
        }
        java.nio.file.Files.move(signed.toPath(), stageApk.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)

        runExec {
            commandLine javaExe.absolutePath, '-jar', new File(btDir, 'lib/apksigner.jar').absolutePath,
                'verify', '--verbose', '--print-certs', stageApk.absolutePath
        }
        logger.lifecycle("[oreki] Gradle 已完成 zipalign/apksigner：${stageApk}")
        runExec {
            workingDir = repoRoot
            commandLine(*fingerprintArgs('commit'))
            // [R77] 统一 JDK：让 Python 及其子进程（D8/apktool/kotlinc）
    // 继承与 Gradle 同一个 JDK，避免「Gradle 用 A、D8 用 B」。
    if (jdkHome != null) {
        environment 'JAVA_HOME', jdkHome.absolutePath
        environment 'PATH', jdkHome.absolutePath + File.separator + 'bin' + File.pathSeparator + System.getenv('PATH')
    }
    environment 'PYTHONIOENCODING', 'utf-8'
        }
    }
    // 不使用 Gradle 自己的 up-to-date 判定：产物由 onlyIf + 指纹决定，
    // 这里保留声明只为让 verifyRelease 能解析到输出文件。
    outputs.upToDateWhen { false }
    outputs.file(stageApk)
}

// =========================================================== prepareVerifyRelease
// [R98] 产物级工具编排迁移：Gradle 负责 Android 官方工具的执行与临时目录生命周期，
// Python verify_release.py 只消费这份工具报告并做基线/补丁语义校验。
def verifyDir = new File(buildRoot, 'gradle-verify-apk')
def verifyToolReport = new File(reportDir, 'verify-release-tools.json')
def aapt2Exe = new File(btDir, isWindows ? 'aapt2.exe' : 'aapt2')
def apksignerJar = new File(btDir, 'lib/apksigner.jar')
def sha256File = { File input ->
    def md = MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buf = new byte[1024 * 1024]
        int n
        while ((n = stream.read(buf)) > 0) md.update(buf, 0, n)
    }
    md.digest().collect { String.format('%02x', it & 0xff) }.join()
}
def capturedExec = { List cmd ->
    def out = new ByteArrayOutputStream()
    def result = execOps.exec {
        commandLine(*cmd)
        standardOutput = out
        errorOutput = out
        ignoreExitValue = true
    }
    [exit: result.exitValue, output: out.toString('UTF-8')]
}

tasks.register('prepareVerifyRelease') {
    group = 'oreki'
    description = '用 Gradle/Android 官方工具准备候选 APK 的产物级校验输入'
    dependsOn 'assembleRelease'
    inputs.file(stageApk)
    outputs.file(verifyToolReport)
    outputs.dir(verifyDir)
    outputs.upToDateWhen { false }
    doLast {
        if (!stageApk.isFile()) throw new GradleException("候选 APK 不存在：${stageApk}")
        reportDir.mkdirs()
        if (verifyDir.exists()) delete verifyDir

        def badging = capturedExec([aapt2Exe.absolutePath, 'dump', 'badging', stageApk.absolutePath])
        def v2 = capturedExec([javaExe.absolutePath, '-jar', apksignerJar.absolutePath, 'verify', '--verbose',
                               '--print-certs', '--min-sdk-version', '24', '--max-sdk-version', '27', stageApk.absolutePath])
        def v3 = capturedExec([javaExe.absolutePath, '-jar', apksignerJar.absolutePath, 'verify', '--verbose',
                               '--print-certs', '--min-sdk-version', '28', '--max-sdk-version', '32', stageApk.absolutePath])
        def decoded = capturedExec([javaExe.absolutePath, '-Xmx4g', '-jar', apktoolJar.absolutePath,
                                    'd', '-r', '-f', '-o', verifyDir.absolutePath, stageApk.absolutePath])
        if (decoded.exit != 0 || !new File(verifyDir, 'smali').isDirectory()) {
            throw new GradleException("apktool 产物准备失败（exit=${decoded.exit}）：${decoded.output.takeRight(1500)}")
        }

        def payload = [
            apk: stageApk.absolutePath,
            size: stageApk.length(),
            sha256: sha256File(stageApk),
            badging: [exit: badging.exit, output: badging.output],
            sign_v2: [exit: v2.exit, output: v2.output],
            sign_v3: [exit: v3.exit, output: v3.output],
            prepared_dir: verifyDir.absolutePath,
            apktool_exit: decoded.exit,
        ]
        verifyToolReport.text = JsonOutput.prettyPrint(JsonOutput.toJson(payload)) + System.lineSeparator()
        logger.lifecycle("[oreki] 产物工具准备完成：${verifyToolReport}")
    }
}

