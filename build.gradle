// =============================================================== installToRelease
// 显式任务：把已通过 verifyRelease 的候选替换为正式发布文件。默认不参与 build。
tasks.register('installToRelease') {
    group = 'oreki'
    description = '把验证通过的候选 APK 复制到 release/（覆盖前先比对哈希并留档）'
    dependsOn 'verifyRelease'
    doLast {
        if (!stageApk.exists()) throw new GradleException("候选 APK 不存在：${stageApk}")
        def stageHash = hashOf(stageApk)
        def stageSize = stageApk.length()
        step("候选 SHA-256: ${stageHash} (${stageSize} B)")
        if (releaseApk.exists()) {
            def oldHash = hashOf(releaseApk)
            step("现有发布 SHA-256: ${oldHash}")
            if (oldHash == stageHash) {
                step('候选与现有发布完全一致，无需替换')
                return
            }
            releaseApk.parentFile.mkdirs()
        }
        releaseApk.parentFile.mkdirs()
        java.nio.file.Files.copy(stageApk.toPath(), releaseApk.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def newHash = hashOf(releaseApk)
        if (newHash != stageHash) throw new GradleException("复制后哈希不一致: ${newHash} != ${stageHash}")
        step("已替换 release/反物质维度.apk -> ${newHash}")
    }
}

// ================================================================ publishRelease
tasks.register('publishRelease', Exec) {
    group = 'oreki'
    description = '按既有流程发布到 OneDrive / 小米云盘 并回读校验（不做 KDE 直发）'
    dependsOn 'installToRelease'
    workingDir = repoRoot
    commandLine pythonExe, 'scripts/publish_apk.py', '--no-kde'
    environment 'PYTHONIOENCODING', 'utf-8'
    outputs.upToDateWhen { false }
}

// ------------------------------------------------------------------ helpers
String hashOf(File f) {
    def md = java.security.MessageDigest.getInstance('SHA-256')
    f.withInputStream { is ->
        byte[] buf = new byte[1 << 20]
        int n
        while ((n = is.read(buf)) > 0) md.update(buf, 0, n)
    }
    return md.digest().collect { String.format('%02x', it) }.join('')
}

// ====================================================================== clean
// 覆盖 Gradle 默认 clean：只清 Gradle 自己的暂存目录。
// build/ 下还有 onedrive_archive/、xiaomi_archive/、backup_*.apk 等唯一备份，
// release/ 下是正式发布物 —— 一律不得被 clean 触碰。
tasks.register('clean') {
    group = 'oreki'
    description = '只清理 build/gradle-stage 与 build/gradle-reports（不动 release/ 与 build/ 归档备份）'
    doLast {
        [stageDir, new File(buildRoot, 'gradle-verify-apk')].each { d ->
            if (d.exists()) { d.deleteDir(); step("已删除 ${d}") }
        }
        step('release/、build/*archive*、build/backup* 未被触碰')
    }
}
